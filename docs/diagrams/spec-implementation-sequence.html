<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve the spec before coding</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 960px; min-width: 0; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    .name { font: 600 12px 'Geist', sans-serif; fill: #2d3142; }
    .heading { font: 600 14px 'Geist', sans-serif; fill: #2d3142; }
    .diagram-title { font: 400 28px 'Instrument Serif', serif; fill: #2d3142; }
    .note { font: 400 11px 'Geist', sans-serif; fill: #4f5d75; }
    .sub { font: 400 9px 'Geist Mono', monospace; fill: #4f5d75; }
    .tag, .arrow-label { font: 400 8px 'Geist Mono', monospace; fill: #4f5d75; letter-spacing: 0.06em; }
    .legend { font: 400 9px 'Geist', sans-serif; fill: #4f5d75; }
    .box { stroke-width: 1; }
    .backend { fill: #ffffff; stroke: #2d3142; }
    .focal { fill: rgba(235,108,54,0.08); stroke: #eb6c36; }
    .store { fill: rgba(45,49,66,0.05); stroke: #4f5d75; }
    .external { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.30); }
    .optional { fill: rgba(45,49,66,0.02); stroke: rgba(45,49,66,0.30); stroke-dasharray: 4,3; }
    .zone { fill: rgba(45,49,66,0.02); stroke: rgba(45,49,66,0.25); stroke-dasharray: 4,4; }
    .tag-box { fill: none; stroke: #bfc0c0; stroke-width: 0.8; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">NDA Harness · Sequence</p>
    <h1>Approve the spec before coding</h1>

    <!-- Replace spec-implementation-sequence with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spec-implementation-sequence-title spec-implementation-sequence-desc">
        <title id="spec-implementation-sequence-title">Approve the spec before coding</title>
        <desc id="spec-implementation-sequence-desc">A tech lead creates a GitHub issue; one issue-numbered branch supplies a non-closing spec PR and a later closing implementation PR, with local TDD after spec approval and merge.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <text x="40" y="52" class="diagram-title" text-anchor="start">Approve the spec before coding</text>
<text x="40" y="76" class="note" text-anchor="start">Tech lead creates issue #123 first. The spec PR references it; the code PR closes it after accepted work.</text>
<line x1="128" y1="160" x2="128" y2="540" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
<line x1="400" y1="160" x2="400" y2="540" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
<line x1="672" y1="160" x2="672" y2="540" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
<line x1="856" y1="160" x2="856" y2="540" stroke="rgba(45,49,66,0.20)" stroke-dasharray="3,3"/>
<path data-connector="true" d="M 128,200 H 400" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<g data-label="SPEC PR"><rect x="238.0" y="176" width="52" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="188" class="arrow-label" text-anchor="middle">SPEC PR</text></g>
<path data-connector="true" d="M 672,248 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<g data-label="APPROVE SPEC"><rect x="498.0" y="224" width="76" height="16" rx="2" fill="#f5f5f5"/><text x="536" y="236" class="arrow-label" text-anchor="middle">APPROVE SPEC</text></g>
<path data-connector="true" d="M 400,296 H 128" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<g data-label="MERGED SPEC"><rect x="228.0" y="272" width="72" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="284" class="arrow-label" text-anchor="middle">MERGED SPEC</text></g>
<path data-connector="true" d="M 128,412 H 400" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<g data-label="CODE PR"><rect x="238.0" y="388" width="52" height="16" rx="2" fill="#f5f5f5"/><text x="264" y="400" class="arrow-label" text-anchor="middle">CODE PR</text></g>
<path data-connector="true" d="M 400,448 H 856" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<g data-label="RUN CHECKS"><rect x="594.0" y="424" width="68" height="16" rx="2" fill="#f5f5f5"/><text x="628" y="436" class="arrow-label" text-anchor="middle">RUN CHECKS</text></g>
<path data-connector="true" d="M 856,480 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<g data-label="PASS"><rect x="610.0" y="456" width="36" height="16" rx="2" fill="#f5f5f5"/><text x="628" y="468" class="arrow-label" text-anchor="middle">PASS</text></g>
<path data-connector="true" d="M 672,528 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<g data-label="REVIEW / MERGE"><rect x="492.0" y="504" width="88" height="16" rx="2" fill="#f5f5f5"/><text x="536" y="516" class="arrow-label" text-anchor="middle">REVIEW / MERGE</text></g>
<path data-connector="true" d="M 128,340 H 176 Q 184,340 184,348 V 364 Q 184,372 176,372 H 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="192" y="348" width="80" height="16" rx="2" fill="#f5f5f5"/>
<text x="232" y="360" class="arrow-label" text-anchor="middle">TDD LOOP</text>
<text x="192" y="380" class="note" text-anchor="start">Red → Green → Refactor</text>
<g data-node="Developer + agent">
      <rect x="40" y="96" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="96" width="176" height="64" rx="6" class="box backend"/>
      <rect x="52" y="104" width="42" height="16" rx="2" class="tag-box"/>
      <text x="58" y="116" class="tag" text-anchor="start">LOCAL</text>
      <text x="128.0" y="136" class="name" text-anchor="middle">Developer + agent</text>
      <text x="128.0" y="152" class="sub" text-anchor="middle">local checkout</text>
    </g>
<g data-node="GitHub">
      <rect x="320" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="96" width="160" height="64" rx="6" class="box external"/>
      <rect x="332" y="104" width="48" height="16" rx="2" class="tag-box"/>
      <text x="338" y="116" class="tag" text-anchor="start">REMOTE</text>
      <text x="400.0" y="136" class="name" text-anchor="middle">GitHub</text>
      <text x="400.0" y="152" class="sub" text-anchor="middle">spec PR / code PR</text>
    </g>
<g data-node="Tech lead">
      <rect x="596" y="96" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="596" y="96" width="152" height="64" rx="6" class="box external"/>
      <rect x="608" y="104" width="42" height="16" rx="2" class="tag-box"/>
      <text x="614" y="116" class="tag" text-anchor="start">HUMAN</text>
      <text x="672.0" y="136" class="name" text-anchor="middle">Tech lead</text>
      <text x="672.0" y="152" class="sub" text-anchor="middle">separate device</text>
    </g>
<g data-node="GitHub Actions">
      <rect x="788" y="96" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="788" y="96" width="136" height="64" rx="6" class="box optional"/>
      <rect x="800" y="104" width="24" height="16" rx="2" class="tag-box"/>
      <text x="806" y="116" class="tag" text-anchor="start">CI</text>
      <text x="856.0" y="136" class="name" text-anchor="middle">GitHub Actions</text>
      <text x="856.0" y="152" class="sub" text-anchor="middle">proposed gates</text>
    </g>
<line x1="40" y1="556" x2="920" y2="556" stroke="#bfc0c0" stroke-width="0.8"/><line x1="40" y1="576" x2="68" y2="576" stroke="#eb6c36" stroke-width="1.2"/><text x="80" y="580" class="legend" text-anchor="start">Approved spec unblocks TDD</text><line x1="344" y1="576" x2="372" y2="576" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/><text x="384" y="580" class="legend" text-anchor="start">Check result</text><line x1="560" y1="576" x2="588" y2="576" stroke="#4f5d75" stroke-width="1.2"/><text x="600" y="580" class="legend" text-anchor="start">Time flows from top to bottom</text>

      </svg>
    </div>
  </div>
</body>
</html>
